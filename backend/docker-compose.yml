services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: road_resilience
      POSTGRES_USER: road_user
      POSTGRES_PASSWORD: road_password
    ports:
      - "5432:5432"
    volumes:
      - road_resilience_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U road_user -d road_resilience"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  road_resilience_postgres:
