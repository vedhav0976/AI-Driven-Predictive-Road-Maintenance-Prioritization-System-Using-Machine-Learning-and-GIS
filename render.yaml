services:
  - type: web
    name: road-resilience
    runtime: docker
    region: singapore
    plan: 1c-2g
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: road-resilience-db
          property: connectionString
databases:
  - name: road-resilience-db
    region: singapore
    plan: 0.1c-256mb
    databaseName: road_resilience
